<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Blur — Help Me Focus</title>
  <style>
    body { width: 240px; margin: 0; padding: 16px; font: 14px/1.5 system-ui, sans-serif; color: #202124; background: #fff; }
    h1 { font-size: 16px; margin: 0 0 16px; }
    label { display: flex; justify-content: space-between; }
    input { width: 100%; margin: 10px 0 18px; accent-color: #1a73e8; }
    button { width: 100%; padding: 9px; margin-top: 8px; border: 1px solid #dadce0; border-radius: 6px; background: #fff; color: #202124; font: inherit; cursor: pointer; }
    button:disabled { opacity: .5; cursor: default; }
    #error { color: #b3261e; font-size: 12px; margin-bottom: 0; }
  </style>
</head>
<body>
  <h1>Blur — Help Me Focus</h1>
  <label for="strength">Blur strength <output id="value" for="strength">8 px</output></label>
  <input id="strength" type="range" min="0" max="40" value="8" disabled>
  <button id="remove" disabled>Remove blur</button>
  <p id="error" role="alert" hidden></p>
  <script src="popup.js"></script>
</body>
</html>
